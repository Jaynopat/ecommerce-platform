services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ── Mongo containers ──────────────────────────────────────────
  mongo-auth:
    image: mongo:7
    volumes:
      - mongo-auth-data:/data/db
    networks:
      - ecommerce-network

  mongo-catalog:
    image: mongo:7
    volumes:
      - mongo-catalog-data:/data/db
    networks:
      - ecommerce-network

  mongo-order:
    image: mongo:7
    volumes:
      - mongo-order-data:/data/db
    networks:
      - ecommerce-network

  mongo-payment:
    image: mongo:7
    volumes:
      - mongo-payment-data:/data/db
    networks:
      - ecommerce-network

  mongo-inventory:
    image: mongo:7
    volumes:
      - mongo-inventory-data:/data/db
    networks:
      - ecommerce-network

  mongo-shipping:
    image: mongo:7
    volumes:
      - mongo-shipping-data:/data/db
    networks:
      - ecommerce-network

  mongo-review:
    image: mongo:7
    volumes:
      - mongo-review-data:/data/db
    networks:
      - ecommerce-network

  mongo-notification:
    image: mongo:7
    volumes:
      - mongo-notification-data:/data/db
    networks:
      - ecommerce-network

  mongo-seller:
    image: mongo:7
    volumes:
      - mongo-seller-data:/data/db
    networks:
      - ecommerce-network

  mongo-analytics:
    image: mongo:7
    volumes:
      - mongo-analytics-data:/data/db
    networks:
      - ecommerce-network

  mongo-search:
    image: mongo:7
    volumes:
      - mongo-search-data:/data/db
    networks:
      - ecommerce-network

  # ── Application services ───────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: mysupersecretkey123
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      SHIPPING_SERVICE_URL: http://shipping-service:3006
      REVIEW_SERVICE_URL: http://review-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      SELLER_SERVICE_URL: http://seller-service:3009
      ANALYTICS_SERVICE_URL: http://analytics-service:3010
      SEARCH_SERVICE_URL: http://search-service:3011
    depends_on:
      - auth-service
      - catalog-service
      - order-service
    networks:
      - ecommerce-network

  auth-service:
    build: ./services/auth-service
    environment:
      MONGO_URI: mongodb://mongo-auth:27017/auth-db
      JWT_SECRET: mysupersecretkey123
      PORT: 3001
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-auth:
        condition: service_started
    networks:
      - ecommerce-network

  catalog-service:
    build: ./services/catalog-service
    environment:
      MONGO_URI: mongodb://mongo-catalog:27017/catalog-db
      PORT: 3002
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-catalog:
        condition: service_started
    networks:
      - ecommerce-network

  order-service:
    build: ./services/order-service
    environment:
      MONGO_URI: mongodb://mongo-order:27017/order-db
      PORT: 3003
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-order:
        condition: service_started
    networks:
      - ecommerce-network

  payment-service:
    build: ./services/payment-service
    environment:
      MONGO_URI: mongodb://mongo-payment:27017/payment-db
      PORT: 3004
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-payment:
        condition: service_started
    networks:
      - ecommerce-network

  inventory-service:
    build: ./services/inventory-service
    environment:
      MONGO_URI: mongodb://mongo-inventory:27017/inventory-db
      PORT: 3005
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-inventory:
        condition: service_started
    networks:
      - ecommerce-network

  shipping-service:
    build: ./services/shipping-service
    environment:
      MONGO_URI: mongodb://mongo-shipping:27017/shipping-db
      PORT: 3006
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-shipping:
        condition: service_started
    networks:
      - ecommerce-network

  review-service:
    build: ./services/review-service
    environment:
      MONGO_URI: mongodb://mongo-review:27017/review-db
      PORT: 3007
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-review:
        condition: service_started
    networks:
      - ecommerce-network

  notification-service:
    build: ./services/notification-service
    environment:
      MONGO_URI: mongodb://mongo-notification:27017/notification-db
      PORT: 3008
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-notification:
        condition: service_started
    networks:
      - ecommerce-network

  seller-service:
    build: ./services/seller-service
    environment:
      MONGO_URI: mongodb://mongo-seller:27017/seller-db
      PORT: 3009
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-seller:
        condition: service_started
    networks:
      - ecommerce-network

  analytics-service:
    build: ./services/analytics-service
    environment:
      MONGO_URI: mongodb://mongo-analytics:27017/analytics-db
      PORT: 3010
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-analytics:
        condition: service_started
    networks:
      - ecommerce-network

  search-service:
    build: ./services/search-service
    environment:
      MONGO_URI: mongodb://mongo-search:27017/search-db
      PORT: 3011
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-search:
        condition: service_started
    networks:
      - ecommerce-network

  messaging-service:
    build: ./services/messaging-service
    environment:
      MONGO_URI: mongodb://mongo-messaging:27017/messaging-db
      PORT: 3012
    depends_on:
      mongo-messaging:
        condition: service_started
    networks:
      - ecommerce-network

  mongo-messaging:
    image: mongo:7
    volumes:
      - mongo-messaging-data:/data/db
    networks:
      - ecommerce-network

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - ecommerce-network

# ── Networks ───────────────────────────────────────────────────
networks:
  ecommerce-network:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────
volumes:
  mongo-auth-data:
  mongo-catalog-data:
  mongo-order-data:
  mongo-payment-data:
  mongo-inventory-data:
  mongo-shipping-data:
  mongo-review-data:
  mongo-notification-data:
  mongo-seller-data:
  mongo-analytics-data:
  mongo-search-data:
  mongo-messaging-data: