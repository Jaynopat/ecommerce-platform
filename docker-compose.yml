version: '3.9'

services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-auth:
    image: mongo:7
    volumes:
      - mongo-auth-data:/data/db

  mongo-catalog:
    image: mongo:7
    volumes:
      - mongo-catalog-data:/data/db

  mongo-order:
    image: mongo:7
    volumes:
      - mongo-order-data:/data/db

  auth-service:
    build: ./services/auth-service
    environment:
      MONGO_URI: mongodb://mongo-auth:27017/auth-db
      JWT_SECRET: mysupersecretkey123
      PORT: 3001
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      - mongo-auth
      - rabbitmq

  catalog-service:
    build: ./services/catalog-service
    environment:
      MONGO_URI: mongodb://mongo-catalog:27017/catalog-db
      PORT: 3002
    depends_on:
      - mongo-catalog

  order-service:
    build: ./services/order-service
    environment:
      MONGO_URI: mongodb://mongo-order:27017/order-db
      PORT: 3003
      RABBITMQ_URL: amqp://admin:password@rabbitmq:5672
    depends_on:
      - mongo-order
      - rabbitmq

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: mysupersecretkey123
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PORT: 3000
    depends_on:
      - auth-service
      - catalog-service
      - order-service

volumes:
  mongo-auth-data:
  mongo-catalog-data:
  mongo-order-data: